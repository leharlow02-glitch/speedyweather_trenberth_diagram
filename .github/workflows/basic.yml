name: Continuous integration setup

on:
  push:
    branches: ["main", "dev", "Lucy", "hannah", "ofer"]
  pull_request:
    branches: ["main", "dev", "Lucy", "hannah", "ofer"]
  workflow_dispatch:

jobs:
  build:
    name: Julia CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: "1.12"

      - name: Install system libraries (common for Makie / NetCDF / Cairo)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxrandr-dev libxext-dev libxrender-dev libxcb1-dev \
            libfreetype6-dev libpng-dev libjpeg-dev \
            libhdf5-dev libnetcdf-dev libproj-dev \
            xvfb \
            && sudo apt-get clean

      - name: Cache Julia registries, packages and artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.julia/registries
            ~/.julia/packages
            ~/.julia/artifacts
            ~/.julia/compiled
          key: julia-${{ runner.os }}-ci-${{ hashFiles('ci/Manifest.toml') }}
          restore-keys: |
            julia-${{ runner.os }}-ci-

      - name: Instantiate CI environment (uses pinned ci/Project.toml)
        run: julia --project=ci -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run tests (or run a script)
        # Option A: run your tests (if you have a test suite)
        run: julia --project=ci -e 'using Pkg; Pkg.test()'

        # Option B (alternate): to run a script that uses GL backends, use xvfb-run:
        # run: xvfb-run julia --project=ci path/to/your_script.jl
